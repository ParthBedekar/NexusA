<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Review Civilization — AksharaNexus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink:        #0f0e0d;
            --paper:      #faf8f4;
            --warm:       #f0ebe0;
            --accent:     #c8562a;
            --accent-2:   #2a5bc8;
            --muted:      #7a7060;
            --border:     #ddd8cc;
            --faint:      #b0a898;
            --rev-ink:    #2a5bc8;
            --pub-ink:    #1e7a4a;
            --rej-ink:    #c0392b;
            --rev-bg:     #eef2fc;
            --pub-bg:     #edf7f1;
            --rej-bg:     #fdf0ef;
            --mono:       'DM Mono', monospace;
            --serif:      'Instrument Serif', serif;
            --sans:       'DM Sans', sans-serif;
            --radius:     6px;
            --nav-h:      60px;
        }

        html, body {
            height: 100%;
            font-family: var(--sans);
            background: var(--paper);
            color: var(--ink);
            font-size: 16px; /* Increased base size for better readability */
            line-height: 1.6;
        }

        /* ── Nav ── */
        .nav {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--nav-h);
            background: #fff;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }
        .nav-left { display: flex; align-items: center; gap: 16px; }
        .nav-logo { font-family: var(--serif); font-size: 1.3rem; letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
        .nav-logo em { color: var(--accent); font-style: italic; }
        .nav-sep { color: var(--faint); }
        .nav-civ-name { font-size: .95rem; font-weight: 500; color: var(--muted); max-width: 400px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-back {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 14px; border: 1px solid var(--border); border-radius: var(--radius);
            background: transparent; color: var(--muted); font-family: var(--sans); font-size: .85rem;
            cursor: pointer; text-decoration: none; transition: border-color .15s, color .15s;
        }
        .btn-back:hover { border-color: var(--ink); color: var(--ink); }
        .reviewer-chip {
            font-family: var(--mono); font-size: .75rem; letter-spacing: .04em;
            padding: 6px 12px; background: var(--warm); border: 1px solid var(--border);
            border-radius: 20px; color: var(--muted);
        }

        /* ── Shell (Two Columns Now) ── */
        .civ-shell {
            display: grid;
            grid-template-columns: 1fr 320px;
            height: calc(100vh - var(--nav-h));
            margin-top: var(--nav-h);
            overflow: hidden;
        }

        /* ── Layout Panels ── */
        .col-center { display: flex; flex-direction: column; overflow: hidden; background: #fff; }
        .col-right {
            border-left: 1px solid var(--border);
            display: flex; flex-direction: column;
            overflow: hidden;
            background: var(--paper);
        }

        .panel-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .panel-title {
            font-family: var(--mono); font-size: .75rem; letter-spacing: .12em;
            text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
        }
        .panel-sub { font-size: .85rem; color: var(--faint); }

        /* ── Center Content: Meta + Tree ── */
        .civ-meta {
            padding: 28px 32px 24px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--paper);
        }
        .civ-meta-title {
            font-family: var(--serif); font-size: 2.2rem; letter-spacing: -.02em;
            line-height: 1.2; margin-bottom: 12px;
        }
        .civ-meta-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
        .civ-meta-pill {
            font-family: var(--mono); font-size: .75rem; letter-spacing: .06em;
            padding: 4px 12px; background: #fff; border: 1px solid var(--border);
            border-radius: 20px; color: var(--muted);
        }
        .civ-meta-desc { font-size: 1rem; color: var(--muted); line-height: 1.6; max-width: 800px; }

        .commit-box {
            margin: 16px 32px 0; padding: 12px 18px; background: var(--warm);
            border: 1px solid var(--border); border-radius: var(--radius);
            font-size: .9rem; color: var(--muted); font-style: italic;
            flex-shrink: 0;
        }
        .commit-box strong { color: var(--ink); font-style: normal; font-weight: 500; }

        .tree-container {
            flex: 1; overflow: hidden; display: flex; flex-direction: column;
        }
        .tree-toolbar {
            padding: 16px 32px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0;
            background: #fff;
        }
        .tree-toolbar-title {
            font-family: var(--mono); font-size: .75rem; letter-spacing: .12em;
            text-transform: uppercase; color: var(--muted);
            display: flex; align-items: center; gap: 12px;
        }
        .ro-badge {
            font-family: var(--mono); font-size: .65rem; letter-spacing: .08em;
            padding: 2px 8px; background: var(--warm); border: 1px solid var(--border);
            border-radius: 3px; color: var(--muted); text-transform: uppercase;
        }
        .tree-body {
            flex: 1; overflow-y: auto;
            padding: 24px 32px;
        }

        /* ── Tree Nodes (Enlarged & Spaced) ── */
        .tree-node-wrap { margin-bottom: 6px; }
        .tree-node-row {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 12px; border-radius: var(--radius);
            transition: background .1s;
        }
        .tree-node-row:hover { background: var(--warm); }
        .tree-toggle {
            width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--faint); font-size: .75rem;
            transition: transform .15s; flex-shrink: 0;
            background: none; border: none;
        }
        .tree-toggle.open { transform: rotate(90deg); }
        .tree-toggle-spacer { width: 20px; flex-shrink: 0; }
        .tree-node-glyph { color: var(--faint); font-size: 1rem; flex-shrink: 0; width: 20px; text-align: center; }
        .tree-node-label {
            font-size: 1.05rem; color: var(--ink); flex: 1; font-weight: 400;
        }
        .entry-label {
            cursor: pointer; color: var(--accent-2);
            text-decoration: underline; text-underline-offset: 3px; text-decoration-color: transparent;
            transition: text-decoration-color .15s;
        }
        .entry-label:hover { text-decoration-color: var(--accent-2); }
        .tree-node-meta {
            font-family: var(--mono); font-size: .75rem; color: var(--faint);
            white-space: nowrap; flex-shrink: 0;
        }
        .tree-children-wrap { padding-left: 32px; border-left: 1px dashed var(--border); margin-left: 10px; }

        /* ── Right Panel: Info ── */
        .commit-info { flex: 1; overflow-y: auto; padding: 0; }
        .ci-section { padding: 18px 24px; border-bottom: 1px solid var(--border); }
        .ci-label {
            font-family: var(--mono); font-size: .7rem; letter-spacing: .1em;
            text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
        }
        .ci-val { font-size: .9rem; color: var(--ink); line-height: 1.5; word-break: break-word; }
        .ci-val.mono { font-family: var(--mono); font-size: .8rem; }
        .ci-val.muted { color: var(--muted); font-style: italic; }

        .status-badge {
            display: inline-block;
            font-family: var(--mono); font-size: .65rem; letter-spacing: .08em;
            text-transform: uppercase; padding: 4px 10px; border-radius: 3px;
            font-weight: 500;
        }
        .status-PENDING_REVIEW    { background: var(--rev-bg); color: var(--rev-ink); }
        .status-PUBLISHED         { background: var(--pub-bg); color: var(--pub-ink); }
        .status-REJECTED          { background: var(--rej-bg); color: var(--rej-ink); }
        .status-DRAFT             { background: var(--warm);   color: var(--muted); }
        .status-REVISION_REQUESTED { background: #fff8e6; color: #a06000; }

        .tree-status-badge {
            font-family: var(--mono);
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 3px;
            margin-left: 8px;
            font-weight: 500;
            text-transform: uppercase;
            display: inline-block;
        }
        .tree-status-badge.APPROVED {
            background: var(--pub-bg);
            color: var(--pub-ink);
        }
        .tree-status-badge.REJECTED {
            background: var(--rej-bg);
            color: var(--rej-ink);
        }
        .tree-status-badge.REVISION_REQUESTED {
            background: #fff8e6;
            color: #a06000;
        }

        /* ── Empty / Skeleton ── */
        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 60px 24px; text-align: center; color: var(--faint);
        }
        .empty-icon { font-size: 2rem; margin-bottom: 12px; }
        .empty-state h3 { font-size: 1rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
        .empty-state p { font-size: .85rem; }

        /* ── Spinner ── */
        .spinner {
            width: 24px; height: 24px; border: 2.5px solid var(--border);
            border-top-color: var(--muted); border-radius: 50%;
            animation: spin .7s linear infinite; display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- Nav -->
<nav class="nav">
    <div class="nav-left">
        <a href="dashboard.html" class="btn-back">← Back</a>
        <a href="dashboard.html" class="nav-logo">Akshara<em>Nexus</em></a>
        <span class="nav-sep">/</span>
        <span class="nav-civ-name" id="nav-civ-name">Loading…</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
        <span class="reviewer-chip" id="nav-reviewer">—</span>
    </div>
</nav>

<div class="civ-shell">

    <!-- ── MAIN CONTENT AREA: Meta + Tree ── -->
    <div class="col-center">
        <div class="civ-meta" id="civ-meta">
            <div class="empty-state"><div class="spinner"></div></div>
        </div>
        <div class="commit-box" id="commit-box" style="display:none;">
            <strong>Review Context: </strong><span id="commit-msg-text"></span>
        </div>
        <div class="tree-container">
            <div class="tree-toolbar">
                <div class="tree-toolbar-title">
                    Knowledge tree
                    <span class="ro-badge">read-only</span>
                </div>
            </div>
            <div class="tree-body" id="tree-body">
                <div class="empty-state">
                    <div class="empty-icon">◈</div>
                    <h3>Loading Knowledge Structure...</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- ── RIGHT SIDEBAR: Snapshot Info ── -->
    <div class="col-right">
        <div class="panel-header">
            <div class="panel-title">Metadata Details</div>
            <div class="panel-sub">Submission Parameters</div>
        </div>
        <div class="commit-info" id="commit-info">
            <div class="ci-section" style="padding:40px 18px;text-align:center;color:var(--faint);font-size:.85rem">
                Gathering version variables…
            </div>
        </div>
    </div>

</div>

<script type="module">
    import {
        isLoggedIn, getReviewerEmail,
        getVersionDetail, getVersionMarks
    } from './api.js';

    const versionMarksMap = new Map();

    if (!isLoggedIn()) { window.location.href = 'login.html'; }

    const params    = new URLSearchParams(window.location.search);
    const versionId = params.get('versionId');
    const civTitle  = params.get('civTitle') || '';

    document.getElementById('nav-reviewer').textContent = getReviewerEmail();
    if (civTitle) document.getElementById('nav-civ-name').textContent = decodeURIComponent(civTitle);

    function formatYear(y) {
        if (y == null) return '?';
        return y < 0 ? `${Math.abs(y)} BCE` : `${y} CE`;
    }

    function fmtDate(ts) {
        if (!ts) return '—';
        return new Date(ts).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    }

    function statusBadge(s) {
        return `<span class="status-badge status-${s}">${s.replace(/_/g,' ')}</span>`;
    }

    async function loadReviewWorkspace() {
        if (!versionId) {
            document.getElementById('tree-body').innerHTML =
                `<div class="empty-state"><div class="empty-icon">⚠</div><h3>Missing target identifier</h3><p>Please return to the dashboard and select a proper civilization package.</p></div>`;
            return;
        }
        try {
            const [v, marks] = await Promise.all([
                getVersionDetail(versionId),
                getVersionMarks(versionId).catch(() => [])
            ]);

            if (marks && Array.isArray(marks)) {
                marks.forEach(m => {
                    if (m.nodeId) {
                        versionMarksMap.set(m.nodeId, m.markStatus);
                    }
                });
            }

            if (v.civTitle) {
                document.getElementById('nav-civ-name').textContent = v.civTitle;
                document.title = `Review: ${v.civTitle} — AksharaNexus`;
            }

            // Populate visual components directly
            renderMeta(v);
            renderCommitBox(v);
            renderTree(v);
            renderCommitInfo(v);
        } catch(e) {
            document.getElementById('tree-body').innerHTML =
                `<div class="empty-state"><div class="empty-icon">⚠</div><h3>Error parsing data structure</h3><p>${e.message}</p></div>`;
        }
    }

    function renderMeta(v) {
        document.getElementById('civ-meta').innerHTML = `
            <div class="civ-meta-title">${v.civTitle || 'Untitled Civilization'}</div>
            <div class="civ-meta-row">
                <span class="civ-meta-pill">🏛 ${v.universityName || '—'}</span>
                <span class="civ-meta-pill">👤 ${v.committedByName || '—'}</span>
                ${statusBadge(v.reviewStatus)}
            </div>
            ${v.civDescription ? `<p class="civ-meta-desc">${v.civDescription}</p>` : ''}
        `;
    }

    function renderCommitBox(v) {
        const box = document.getElementById('commit-box');
        if (v.commitMessage) {
            document.getElementById('commit-msg-text').textContent = v.commitMessage;
            box.style.display = 'block';
        } else {
            box.style.display = 'none';
        }
    }

    function renderCommitInfo(v) {
        document.getElementById('commit-info').innerHTML = `
            <div class="ci-section">
                <div class="ci-label">Origin Institution</div>
                <div class="ci-val">${v.universityName || '—'}</div>
            </div>
            <div class="ci-section">
                <div class="ci-label">Contributor</div>
                <div class="ci-val">${v.committedByName || '—'}</div>
                <div class="ci-val muted" style="margin-top:2px">${v.committedByEmail || ''}</div>
            </div>
            <div class="ci-section">
                <div class="ci-label">Timestamp</div>
                <div class="ci-val">${fmtDate(v.commitTimestamp)}</div>
            </div>
            <div class="ci-section">
                <div class="ci-label">Workflow State</div>
                <div class="ci-val">${statusBadge(v.reviewStatus)}</div>
            </div>
            ${v.reviewerNote ? `
            <div class="ci-section">
                <div class="ci-label">Historical Logs</div>
                <div class="ci-val">${v.reviewerNote}</div>
            </div>` : ''}
            <div class="ci-section">
                <div class="ci-label">Target Hash</div>
                <div class="ci-val mono">${(v.hash || '').substring(0, 16) || '—'}</div>
            </div>
        `;
    }

    function renderTree(v) {
        const body = document.getElementById('tree-body');
        let tree;
        try {
            tree = typeof v.serializedTree === 'string' ? JSON.parse(v.serializedTree) : v.serializedTree;
        } catch {
            body.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠</div><h3>Parse error</h3><p>Could not compile structural system definitions.</p></div>`;
            return;
        }
        if (!tree) {
            body.innerHTML = `<div class="empty-state"><div class="empty-icon">◈</div><h3>Null Node Hierarchy</h3><p>No architecture mappings found inside this package.</p></div>`;
            return;
        }
        body.innerHTML = renderTreeNode(tree, true, v);
    }

    function renderTreeNode(node, isRoot, version, parentData = null) {
        if (!node) return '';
        if (!node.data) {
            return (node.children || []).map(c => renderTreeNode(c, false, version)).join('');
        }
        const d        = node.data;
        const isVolume = d.nodeType === 'VOLUME';
        const isEntry  = d.nodeType === 'ENTRY';
        const children = node.children || [];
        const hasChildren = children.length > 0;

        let glyph = '◆';
        if (isVolume) glyph = '§';
        if (isEntry)  glyph = '–';

        const metaText = d.startYear != null ? `${formatYear(d.startYear)} – ${formatYear(d.endYear)}` : '';

        const civTitleEnc = encodeURIComponent(version?.civTitle || '');
        const volTitleEnc = encodeURIComponent(parentData?.title || d.title || '');
        const entryUrl    = `reviewer-entry.html?versionId=${version?.versionId}&nodeId=${node.nodeId}&civTitle=${civTitleEnc}&volTitle=${volTitleEnc}`;

        const status = versionMarksMap.get(node.nodeId);
        let statusBadgeHtml = '';
        if (status) {
            let statusText = status.replace(/_/g, ' ');
            statusBadgeHtml = `<span class="tree-status-badge ${status}" title="Review status: ${statusText}">${statusText}</span>`;
        }

        const labelHtml = isEntry
            ? `<span class="tree-node-label entry-label" onclick="window.location.href='${entryUrl}'">${d.title || 'Untitled Node'}</span>${statusBadgeHtml}`
            : `<span class="tree-node-label">${d.title || 'Untitled Structure'}</span>`;

        const childrenHtml = hasChildren
            ? `<div class="tree-children-wrap">${children.map(c => renderTreeNode(c, false, version, d)).join('')}</div>`
            : '';

        return `
            <div class="tree-node-wrap">
                <div class="tree-node-row">
                    ${hasChildren
            ? `<button class="tree-toggle open" onclick="toggleNode(this)">&#9658;</button>`
            : `<span class="tree-toggle-spacer"></span>`}
                    <span class="tree-node-glyph">${glyph}</span>
                    ${labelHtml}
                    ${metaText ? `<span class="tree-node-meta">${metaText}</span>` : ''}
                </div>
                ${childrenHtml}
            </div>`;
    }

    window.toggleNode = function(btn) {
        const row  = btn.closest('.tree-node-row');
        const wrap = row.nextElementSibling;
        if (!wrap) return;
        const isOpen = btn.classList.contains('open');
        btn.classList.toggle('open', !isOpen);
        wrap.style.display = isOpen ? 'none' : '';
    };

    loadReviewWorkspace();
</script>
</body>
</html>
