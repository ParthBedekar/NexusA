<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>AksharaNexus — Reviewer Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

        :root {
            --ink:       #0f0e0d;
            --paper:     #faf8f4;
            --warm:      #f0ebe0;
            --accent:    #c8562a;
            --accent-2:  #2a5bc8;
            --muted:     #7a7060;
            --border:    #ddd8cc;
            --err:       #c0392b;
            --radius:    6px;
            --mono:      'DM Mono', monospace;
            --serif:     'Instrument Serif', serif;
            --sans:      'DM Sans', sans-serif;
        }

        html,body { height:100%; font-family:var(--sans); background:var(--paper); color:var(--ink); }

        body {
            display:flex; align-items:center; justify-content:center;
            min-height:100vh;
            background-image:
                    radial-gradient(ellipse 60% 50% at 20% 20%, rgba(200,86,42,0.07) 0%, transparent 70%),
                    radial-gradient(ellipse 50% 60% at 80% 80%, rgba(42,91,200,0.06) 0%, transparent 70%);
        }

        /* Decorative grain overlay */
        body::before {
            content:'';
            position:fixed; inset:0; pointer-events:none; z-index:0;
            opacity:.025;
            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-size:256px 256px;
        }

        .shell {
            position:relative; z-index:1;
            width:100%; max-width:420px;
            padding:24px;
        }

        .wordmark {
            font-family:var(--serif);
            font-size:1.5rem;
            letter-spacing:-.02em;
            color:var(--ink);
            margin-bottom:4px;
        }
        .wordmark em { color:var(--accent); font-style:italic; }

        .tagline {
            font-family:var(--mono);
            font-size:.7rem;
            letter-spacing:.12em;
            text-transform:uppercase;
            color:var(--muted);
            margin-bottom:40px;
        }

        .card {
            background:#fff;
            border:1px solid var(--border);
            border-radius:10px;
            padding:36px 32px;
            box-shadow:0 2px 24px rgba(15,14,13,.06), 0 1px 3px rgba(15,14,13,.04);
        }

        .card-title {
            font-family:var(--serif);
            font-size:1.7rem;
            line-height:1.15;
            margin-bottom:8px;
            letter-spacing:-.02em;
        }
        .card-sub {
            font-size:.83rem;
            color:var(--muted);
            margin-bottom:28px;
            line-height:1.55;
        }

        .form-group { margin-bottom:18px; }
        label {
            display:block;
            font-size:.75rem;
            font-weight:500;
            letter-spacing:.06em;
            text-transform:uppercase;
            color:var(--muted);
            margin-bottom:7px;
        }
        input[type=email], input[type=password] {
            width:100%;
            padding:11px 14px;
            border:1.5px solid var(--border);
            border-radius:var(--radius);
            font-family:var(--sans);
            font-size:.9rem;
            color:var(--ink);
            background:var(--paper);
            transition:border-color .15s, box-shadow .15s;
            outline:none;
        }
        input:focus {
            border-color:var(--accent);
            box-shadow:0 0 0 3px rgba(200,86,42,.1);
        }

        .btn-login {
            width:100%; padding:12px;
            background:var(--ink);
            color:#fff;
            border:none; border-radius:var(--radius);
            font-family:var(--sans); font-size:.9rem; font-weight:500;
            cursor:pointer;
            transition:background .15s, transform .1s;
            margin-top:4px;
        }
        .btn-login:hover  { background:#2a2520; }
        .btn-login:active { transform:scale(.99); }
        .btn-login:disabled { opacity:.5; cursor:not-allowed; }

        .error-box {
            display:none;
            background:#fdf0ef;
            border:1px solid #f5c6c4;
            color:var(--err);
            font-size:.82rem;
            padding:10px 13px;
            border-radius:var(--radius);
            margin-bottom:16px;
        }
        .error-box.show { display:block; }

        .card-footer {
            margin-top:22px;
            font-size:.78rem;
            color:var(--muted);
            line-height:1.6;
            text-align:center;
            border-top:1px solid var(--border);
            padding-top:18px;
        }
        .card-footer a {
            color:var(--accent);
            text-decoration:none;
            font-weight:500;
        }
        .card-footer a:hover { text-decoration:underline; }
    </style>
</head>
<body>
<div class="shell">
    <div class="wordmark">Akshara<em>Nexus</em></div>
    <div class="tagline">Reviewer Portal</div>
    <div class="card">
        <h1 class="card-title">Sign in to<br>your workspace</h1>
        <p class="card-sub">Access your review queue and the central civilization archive.</p>
        <div class="error-box" id="err"></div>
        <form id="form" onsubmit="return false">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="reviewer@institution.edu" autocomplete="email" required/>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required/>
            </div>
            <button class="btn-login" id="btn" type="submit">Sign in</button>
        </form>
        <div class="card-footer">
            New reviewer? <a href="register.html">Create an account</a>
        </div>
    </div>
</div>
<script type="module">
    import { login, isLoggedIn } from './api.js';
    if (isLoggedIn()) window.location.href = 'dashboard.html';

    const form = document.getElementById('form');
    const btn  = document.getElementById('btn');
    const err  = document.getElementById('err');

    form.addEventListener('submit', async () => {
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        err.classList.remove('show');
        btn.disabled = true; btn.textContent = 'Signing in…';
        try {
            await login(email, password);
            window.location.href = 'dashboard.html';
        } catch(e) {
            err.textContent = e.message || 'Invalid credentials';
            err.classList.add('show');
            btn.disabled = false; btn.textContent = 'Sign in';
        }
    });
</script>
</body>
</html>
